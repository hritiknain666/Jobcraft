name: Refresh live jobs

# Keep refreshes manual until the first production refresh is verified. Once the
# same JOB_IMPORT_SECRET exists in Cloudflare and GitHub Actions, this workflow
# calls one protected server endpoint that refreshes every enabled free source.
on:
  workflow_dispatch:

concurrency:
  group: jobcraft-live-job-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refresh enabled free job sources
        env:
          SITE_URL: ${{ vars.JOBCRAFT_SITE_URL }}
          IMPORT_SECRET: ${{ secrets.JOB_IMPORT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL}" ]; then
            SITE_URL="https://jobcraft.hritiknain666-35e.workers.dev"
          fi
          SITE_URL="${SITE_URL%/}"

          if [ -z "${IMPORT_SECRET}" ]; then
            echo "::error::JOB_IMPORT_SECRET is not configured in GitHub Actions."
            exit 1
          fi

          STATUS="$(curl --fail --silent --show-error "${SITE_URL}/api/jobs/provider-status")"
          SERVER_READY="$(STATUS_JSON="${STATUS}" node -e 'const s=JSON.parse(process.env.STATUS_JSON); process.stdout.write(s?.server?.importSecretReady && s?.server?.databaseWriteReady ? "yes" : "no")')"
          if [ "${SERVER_READY}" != "yes" ]; then
            echo "::error::The deployed JobCraft server is missing JOB_IMPORT_SECRET or SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi

          echo "Provider status: ${STATUS}"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST "${SITE_URL}/api/jobs/refresh" \
            -H "Authorization: Bearer ${IMPORT_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{}')"

          echo "Refresh result: ${RESPONSE}"
          FAILURES="$(RESULT_JSON="${RESPONSE}" node -e 'const r=JSON.parse(process.env.RESULT_JSON); process.stdout.write(String(r?.summary?.failed ?? 0))')"
          if [ "${FAILURES}" != "0" ]; then
            echo "::warning::One or more free job providers failed; successful providers were still persisted."
          fi
