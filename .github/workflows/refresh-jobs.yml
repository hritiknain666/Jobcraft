name: Refresh live jobs

# Keep refreshes manual until the production provider credentials, publication
# approval, and matching JOB_IMPORT_SECRET are configured. Re-add the schedule
# only after a controlled preview + persisted import has been verified.
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh Adzuna India jobs
        env:
          SITE_URL: ${{ vars.JOBCRAFT_SITE_URL }}
          IMPORT_SECRET: ${{ secrets.JOB_IMPORT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL}" ]; then
            SITE_URL="https://jobcraft.hritiknain666-35e.workers.dev"
          fi
          SITE_URL="${SITE_URL%/}"

          if [ -z "${IMPORT_SECRET}" ]; then
            echo "::error::JOB_IMPORT_SECRET is not configured in GitHub Actions."
            exit 1
          fi

          STATUS="$(curl --fail --silent --show-error "${SITE_URL}/api/jobs/provider-status")"
          READY="$(STATUS_JSON="${STATUS}" node -e 'const s=JSON.parse(process.env.STATUS_JSON); process.stdout.write(s?.adzuna?.importsEnabled ? "yes" : "no")')"
          if [ "${READY}" != "yes" ]; then
            echo "::error::Adzuna imports are not fully enabled on the deployed JobCraft app."
            exit 1
          fi

          for PAGE in 1 2 3 4; do
            curl --fail-with-body --silent --show-error \
              -X POST "${SITE_URL}/api/jobs/import" \
              -H "Authorization: Bearer ${IMPORT_SECRET}" \
              -H "Content-Type: application/json" \
              --data "{\"provider\":\"adzuna\",\"where\":\"India\",\"page\":${PAGE},\"resultsPerPage\":20}"
            echo
          done
