name: Production monitoring

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy production"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: jobcraft-production-monitoring
  cancel-in-progress: true

jobs:
  monitor:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.JOBCRAFT_SITE_URL || 'https://jobcraft.hritiknain666-35e.workers.dev' }}
    steps:
      - name: Check operational health
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"
          HEALTH="$(curl --fail-with-body --silent --show-error --max-time 20 "${SITE_URL}/api/health")"
          echo "Operational health: ${HEALTH}"
          HEALTH_JSON="${HEALTH}" node <<'NODE'
          const health = JSON.parse(process.env.HEALTH_JSON);
          const checks = health?.checks ?? {};
          const refreshStatus = checks?.refresh?.status;
          const aiStatus = checks?.aiRateLimits?.status;

          const criticalFailure =
            health?.status === "unhealthy" ||
            checks?.database !== "ok" ||
            ["failed", "missing", "stale"].includes(refreshStatus) ||
            aiStatus === "spike";

          if (criticalFailure) {
            console.error(`Operational health alert: ${JSON.stringify(checks)}`);
            process.exit(1);
          }

          if (checks?.providers?.status === "degraded") {
            console.warn(
              `Provider warning: ${(checks.providers.unhealthySources ?? []).join(", ") || "degraded"}`,
            );
          }
          NODE

      - name: Check provider feed
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"
          PROVIDERS="$(curl --fail-with-body --silent --show-error --max-time 20 "${SITE_URL}/api/jobs/provider-status")"
          echo "Provider health: ${PROVIDERS}"
          PROVIDER_JSON="${PROVIDERS}" node <<'NODE'
          const providers = JSON.parse(process.env.PROVIDER_JSON);
          const sources = Array.isArray(providers?.sources) ? providers.sources : [];
          const errorSources = sources
            .filter((source) => source?.status === "error")
            .map((source) => source?.source_key);
          const degradedSources = sources
            .filter((source) => source?.status === "degraded")
            .map((source) => source?.source_key);

          if (providers?.status === "unavailable" || errorSources.length > 0) {
            console.error(
              `Provider failure alert: ${errorSources.join(", ") || "provider status unavailable"}`,
            );
            process.exit(1);
          }

          if (degradedSources.length > 0) {
            console.warn(`Provider degradation warning: ${degradedSources.join(", ")}`);
          }
          NODE
